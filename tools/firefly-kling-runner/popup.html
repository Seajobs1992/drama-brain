<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#1b1b1d; --panel:#26262a; --line:#3a3a40; --text:#e9e9ec; --dim:#9a9aa3; --accent:#4f7cff; --ok:#3fb27f; --bad:#e0605a; --warn:#d9a441; }
  body { margin:0; width:520px; font:13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 14px 8px; border-bottom:1px solid var(--line); }
  h1 { font-size:14px; margin:0 0 2px; }
  h2 { font-size:12px; margin:0 0 4px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .sub { color:var(--dim); font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; padding:6px 14px; flex-wrap:wrap; }
  label { color:var(--dim); font-size:12px; }
  select, button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  button { cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.stop { border-color:var(--bad); color:var(--bad); }
  .list { max-height:190px; overflow:auto; margin:4px 14px; border:1px solid var(--line); border-radius:8px; }
  .ep { position:sticky; top:0; background:var(--panel); padding:4px 8px; font-weight:600; font-size:12px; z-index:1; }
  .job { display:grid; grid-template-columns:18px 54px 1fr auto; gap:6px; align-items:center; padding:3px 8px; border-top:1px solid #2c2c31; cursor:pointer; }
  .job:hover { background:#222227; }
  .job.active { background:#24305a; }
  .job .t { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .job .edited { color:var(--warn); font-size:11px; margin-left:4px; }
  .st { font-size:11px; color:var(--dim); white-space:nowrap; max-width:130px; overflow:hidden; text-overflow:ellipsis; }
  .st.downloaded { color:var(--ok); } .st.err { color:var(--bad); } .st.busy { color:var(--warn); }
  #count.zero { color:var(--warn); font-weight:600; }
  .detail { margin:6px 14px; border:1px solid var(--line); border-radius:8px; padding:8px; background:#202024; }
  .dhead { display:flex; gap:10px; align-items:flex-start; }
  .dhead img { width:150px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; background:#000; flex:none; }
  .dmeta b { font-size:14px; }
  .dmeta div { color:var(--dim); font-size:12px; }
  textarea { width:100%; box-sizing:border-box; margin-top:8px; height:150px; resize:vertical; font:12px/1.45 ui-monospace, Menlo, monospace; color:var(--text); background:#121214; border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .drow { display:flex; gap:8px; align-items:center; margin-top:6px; }
  .drow .sub { margin-left:auto; }
  #log { margin:4px 14px 12px; height:80px; overflow:auto; background:#121214; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:11px/1.45 ui-monospace, Menlo, monospace; color:#c9c9cf; white-space:pre-wrap; }
  #msg { color:var(--warn); padding:0 14px; font-size:12px; min-height:16px; }
  .sec { padding:6px 14px 0; }
  .actions { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding-top:6px; }
  .actions .ttl { font-size:13px; margin-right:auto; }
  #msg:empty { display:none; }
  #msg { padding:0 14px 6px; }
  .mini { font-size:11px; padding:1px 6px; margin-left:8px; text-transform:none; letter-spacing:0; }
  .list { max-height:150px; }
  .dhead img { width:120px; }
  textarea { height:96px; }
  #log { height:60px; }
</style>
</head>
<body>
  <div class="actions">
    <div class="row">
      <b class="ttl">LOCKED OUT runner</b>
      <button id="fill">Fill next clip only</button>
      <button id="run" class="primary">Generate &amp; download</button>
      <button id="regen" title="Generate the ticked clips again, even if they are already downloaded. The earlier take is kept.">Regenerate ticked</button>
      <button id="stop" class="stop">Stop</button>
    </div>
    <div id="msg"></div>
  </div>
  <div class="row">
    <label>Resolution <select id="res"><option>720p</option><option>1080p</option></select></label>
    <span class="sub">Sound: dialogue clips only</span>
    <label>At once <select id="maxActive"><option>2</option><option>3</option><option selected>5</option><option>8</option><option value="0">All</option></select></label>
    <label>Give up after <select id="timeout"><option>10</option><option selected>15</option><option>25</option><option>40</option></select> min</label>
  </div>
  <div class="row">
    <span class="sub">Tick:</span>
    <button id="selEP01">EP01</button><button id="selEP02">EP02</button><button id="selEP03">EP03</button><button id="selEP04">EP04</button><button id="selImages">Images</button><button id="selPending">Not downloaded</button><button id="selNone">None</button>
    <span class="sub" id="count"></span>
  </div>
  <div class="list" id="list"></div>

  <div class="sec"><h2>Clip · what gets sent to Firefly</h2></div>
  <div class="detail" id="detail">
    <div class="dhead">
      <img id="dimg" alt="">
      <div class="dmeta">
        <b id="did"></b>
        <div id="dtitle"></div>
        <div id="dset"></div>
        <div id="dout"></div>
      </div>
    </div>
    <textarea id="dprompt" spellcheck="false"></textarea>
    <div class="drow">
      <button id="dsave">Save prompt edit</button>
      <button id="drestore">Restore script prompt</button>
      <button id="dregen" class="primary" title="Generate this one clip again, even if it is already downloaded. The earlier take is kept.">Regenerate this clip</button>
      <span class="sub" id="dnote"></span>
    </div>
  </div>

  <div class="sec"><h2>Run log <button id="reset" class="mini">Reset ticked</button></h2></div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
