<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#1b1b1d; --panel:#26262a; --line:#3a3a40; --text:#e9e9ec; --dim:#9a9aa3; --accent:#ff6a2b; --ok:#3fb27f; --bad:#e0605a; --warn:#d9a441; }
  body { margin:0; width:520px; font:13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  .row { display:flex; gap:8px; align-items:center; padding:6px 14px; flex-wrap:wrap; }
  .actions { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding-top:6px; }
  .ttl { font-size:13px; margin-right:auto; }
  label, .sub { color:var(--dim); font-size:12px; }
  select, button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.stop { border-color:var(--bad); color:var(--bad); }
  #msg { color:var(--warn); padding:0 14px 6px; font-size:12px; }
  #msg:empty { display:none; }
  .list { max-height:220px; overflow:auto; margin:4px 14px; border:1px solid var(--line); border-radius:8px; }
  .ep { position:sticky; top:0; background:var(--panel); padding:4px 8px; font-weight:600; font-size:12px; }
  .job { display:grid; grid-template-columns:18px 70px 44px 1fr auto; gap:6px; align-items:center; padding:3px 8px; border-top:1px solid #2c2c31; }
  .job .t { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kind { font-size:11px; color:var(--dim); }
  .st { font-size:11px; color:var(--dim); white-space:nowrap; max-width:170px; overflow:hidden; text-overflow:ellipsis; }
  .st.saved { color:var(--ok); } .st.err { color:var(--bad); } .st.busy { color:var(--warn); }
  #log { margin:4px 14px 12px; height:110px; overflow:auto; background:#121214; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:11px/1.45 ui-monospace, Menlo, monospace; color:#c9c9cf; white-space:pre-wrap; }
</style>
</head>
<body>
  <div class="actions">
    <div class="row">
      <b class="ttl">Pollo runner <span class="sub" id="ver"></span></b>
      <button id="fill" title="Fill the first ticked job into Pollo and stop before Generate.">Fill next only</button>
      <button id="run" class="primary" title="Send the ticked jobs one after another and save each result.">Run ticked</button>
      <button id="stop" class="stop">Stop</button>
    </div>
    <div id="msg"></div>
  </div>
  <div class="row">
    <span class="sub">Saves to:</span> <b id="outFolder">…</b>
    <button id="folderBtn" title="Choose or change the output folder for this movie (opens the Saver tab)">Folder…</button>
  </div>
  <div class="row">
    <label>At once <select id="maxActive"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
    <label>Pause between jobs <select id="gapSec"><option>0</option><option>3</option><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option><option>45</option><option>60</option><option>120</option></select> s</label>
    <label>Give up after <select id="timeoutMin"><option>10</option><option>15</option><option>20</option><option>30</option><option>40</option><option>60</option><option>90</option><option>120</option></select> min</label>
  </div>
  <div class="row">
    <span class="sub">Tick:</span>
    <button id="selPending">Not saved</button><button id="selImages">Images</button><button id="selVideos">Videos</button><button id="selNone">None</button>
    <button id="redo" title="Clear the status of the ticked jobs so Run sends them again (a new take; the old file is kept).">Redo ticked</button>
    <span class="sub" id="count"></span>
  </div>
  <div class="list" id="list"></div>
  <div class="row sub" id="source"></div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
